# Stock lists and their alert switches live in lists.json in the data folder (edit them on the page).

[stochastic]
period = 14      # look-back in trading days
smooth_k = 3     # 3 = slow stochastic (what most charts show); 1 = fast
d = 3            # %D signal-line length

[alerts]
overbought = 80
oversold = 20
# Which line triggers alerts: "k" or "d"
line = "k"
# Send a notification even when nothing is overbought/oversold
notify_when_quiet = false

[moving_average]
period = 50  # trading days. Which lists alert on a drop below it is set per list on the page.
long_period = 200  # a "death cross" is the 50-day average falling below this one

[highlight]
below_ma_pct = 15  # highlight a whole row when it's oversold AND at least this far below the 50-day MA

[positions]
gain_alert_pct = 40  # default; each person can change it (or turn it off) on the page

[schedule]
# When the alert check runs, in US Eastern time, Monday to Friday
times_et = ["10:00", "12:00", "14:00", "16:00"]
