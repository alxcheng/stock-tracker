[project]
name = "stock-tracker"
version = "1.3.0"
description = "Local stock watchlist with stochastics, 50-day MA, positions and phone alerts"
requires-python = ">=3.11"
dependencies = [
    "yfinance>=0.2.54",
    "pandas>=2.2",
    "segno>=1.6",
    "tzdata>=2024.1",  # time zones on Windows, which has no system tz database
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
